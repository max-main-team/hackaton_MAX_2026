openapi: 3.0.3
info:
  title: MAX Mini App — Reverse Hiring API
  description: |
    API мини-приложения реверс-найма в MAX.

    Авторизация: `POST /auth` с `initData` из MAX Bridge → JWT (7 дней) →
    заголовок `Authorization: Bearer <token>`.

    Пометка `x-stage` — этап, на котором эндпоинт появляется:
    реализованные доступны на проде, остальные — контракт для фронта.
  version: 1.0.0
servers:
  - url: https://eclipse-sim.ru
    description: production
  - url: http://localhost:8080
    description: local dev
security:
  - bearerAuth: []

tags:
  - name: auth
  - name: profile
  - name: resume
  - name: company
  - name: vacancy
  - name: matching
  - name: invitations

paths:
  /api/v1/health:
    get:
      tags: [auth]
      summary: Живость сервиса и БД
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: ok }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth:
    post:
      tags: [auth]
      summary: Авторизация по initData из MAX Bridge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
                  description: Строка window.WebApp.initData (urlencoded key=value)
                  example: 'user=%7B%22id%22%3A42%7D&auth_date=1771409719&hash=...'
      responses:
        '200':
          description: JWT и пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [profile]
      summary: Текущий пользователь
      x-stage: 1 (T-05)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me/role:
    post:
      tags: [profile]
      summary: Выбор роли (+ согласие на обработку ПДн)
      x-stage: 1 (T-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, acceptPersonalData]
              properties:
                role: { type: string, enum: [candidate, recruiter] }
                acceptPersonalData: { type: boolean, example: true }
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/my/resume:
    get:
      tags: [resume]
      summary: Моё резюме
      x-stage: 1 (T-06)
      responses:
        '200':
          description: Резюме
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resume' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [resume]
      summary: Создать/обновить резюме (upsert, пишет версию в историю)
      x-stage: 1 (T-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeInput' }
      responses:
        '200':
          description: Сохранённое резюме
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resume' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/my/resume/confirm-activity:
    post:
      tags: [resume]
      summary: Ответ на еженедельный опрос «подбор актуален?»
      x-stage: 3 (T-12)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Обновлённое резюме
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resume' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/companies:
    post:
      tags: [company]
      summary: Создать компанию (создатель становится участником с выбранной позицией)
      x-stage: 1 (T-07)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200':
          description: Компания
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/my/companies:
    get:
      tags: [company]
      summary: Мои компании
      x-stage: 1 (T-07)
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/companies/{id}/vacancies:
    post:
      tags: [vacancy]
      summary: Создать вакансию
      x-stage: 1 (T-07)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyInput' }
      responses:
        '200':
          description: Вакансия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      tags: [vacancy]
      summary: Вакансии компании
      x-stage: 1 (T-07)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Список вакансий
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vacancy' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/vacancies/{id}:
    patch:
      tags: [vacancy]
      summary: Частичное обновление вакансии (TTL, активность)
      x-stage: 1 (T-07)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyUpdate' }
      responses:
        '200':
          description: Обновлённая вакансия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/vacancies/{id}/candidates:
    get:
      tags: [matching]
      summary: Кандидаты под вакансию (скоринг)
      description: |
        mode=list — постранично (limit/offset), mode=feed — лента без пагинации.
        Только кандидаты с активным резюме и без действия по этой вакансии.
      x-stage: 2 (T-09)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: mode, in: query, schema: { type: string, enum: [list, feed], default: list } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Кандидаты со скорингом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatesResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/vacancies/{id}/candidates/{candidateUserId}/action:
    post:
      tags: [matching]
      summary: Действие рекрутера на кандидата
      x-stage: 2 (T-10)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: candidateUserId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [invite, skip] }
      responses:
        '200':
          description: Действие (повторный вызов вернёт существующее)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterAction' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/my/invitations:
    get:
      tags: [invitations]
      summary: Приглашения текущего кандидата
      x-stage: 2 (T-11)
      responses:
        '200':
          description: Список приглашений
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/invitations/{id}/respond:
    post:
      tags: [invitations]
      summary: Ответ на приглашение (только из статуса pending)
      x-stage: 2 (T-11)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [accept, decline] }
      responses:
        '200':
          description: Ответ (при accept — данные матча)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 42 }
        username: { type: string, example: ivan }
        first_name: { type: string, example: Ivan }
        last_name: { type: string, example: Petrov }
        photo_url: { type: string }
        language_code: { type: string, example: ru }
        role: { type: string, nullable: true, enum: [candidate, recruiter, null] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    MeResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            personal_data_accepted_at:
              type: string
              format: date-time
              nullable: true

    ResumeInput:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Backend-разработчик }
        skills: { type: string, example: 'go, postgres, docker' }
        experience_months: { type: integer, minimum: 0, maximum: 600, example: 36 }
        about: { type: string }
        education: { type: string }
        links:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: github }
              url: { type: string }
        city: { type: string, example: Москва }
        work_format: { type: string, enum: [onsite, hybrid, remote] }
        employment_type: { type: string, enum: [full_time, part_time, contract, internship] }
        salary_min: { type: integer, nullable: true }
        salary_max: { type: integer, nullable: true }

    Resume:
      allOf:
        - $ref: '#/components/schemas/ResumeInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            user_id: { type: integer, format: int64 }
            source: { type: string, enum: [manual, file_parse] }
            source_text: { type: string }
            is_active: { type: boolean }
            last_confirmed_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Ромашка }
        description: { type: string }
        website: { type: string }
        logo_url: { type: string }
        address: { type: string }
        position:
          type: string
          enum: [owner, hr, employee]
          default: owner
          description: позиция создателя в компании

    Company:
      allOf:
        - $ref: '#/components/schemas/CompanyInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            verified: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    VacancyInput:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Go-разработчик }
        description: { type: string }
        required_skills: { type: string, example: 'go, postgres' }
        min_experience_months: { type: integer, default: 0 }
        city: { type: string }
        work_format: { type: string, enum: [onsite, hybrid, remote] }
        employment_type: { type: string, enum: [full_time, part_time, contract, internship] }
        salary_min: { type: integer, nullable: true }
        salary_max: { type: integer, nullable: true }
        response_ttl_hours:
          type: integer
          minimum: 1
          maximum: 336
          default: 48
          description: TTL ответа рекрутера (фича 1.2)

    Vacancy:
      allOf:
        - $ref: '#/components/schemas/VacancyInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            company_id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    VacancyUpdate:
      type: object
      properties:
        response_ttl_hours: { type: integer, minimum: 1, maximum: 336 }
        is_active: { type: boolean }

    CandidatesResponse:
      type: object
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              score: { type: integer, example: 87 }
              breakdown:
                type: object
                properties:
                  skills: { type: integer }
                  city: { type: integer }
                  schedule: { type: integer }
                  experience: { type: integer }
              user: { $ref: '#/components/schemas/User' }
              resume: { $ref: '#/components/schemas/Resume' }

    RecruiterAction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, enum: [invite, skip] }
        created_at: { type: string, format: date-time }

    Invitation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, overdue, responded] }
        deadline_at: { type: string, format: date-time }
        hours_left: { type: number }
        company:
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            verified: { type: boolean }
        vacancy:
          type: object
          properties:
            id: { type: integer, format: int64 }
            title: { type: string }
            city: { type: string }
        response: { type: string, nullable: true, enum: [accept, decline, null] }

    MatchResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        response: { type: string, enum: [accept, decline] }
        company:
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            verified: { type: boolean }
        vacancy:
          type: object
          properties:
            id: { type: integer, format: int64 }
            title: { type: string }
        recruiter_contact: { type: string, description: username рекрутера в MAX }
