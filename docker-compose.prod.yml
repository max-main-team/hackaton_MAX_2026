services:
  postgres:
    image: postgres:17-alpine
    container_name: max-miniapp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/max-main-team/hackaton_max_2026/backend:latest
    restart: unless-stopped
    environment:
      ENV: ${ENV}
      ADDR: ${ADDR}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/max-main-team/hackaton_max_2026/frontend:latest
    restart: unless-stopped
    ports:
      # системный nginx хоста (TLS, 80/443) проксирует на этот порт
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
