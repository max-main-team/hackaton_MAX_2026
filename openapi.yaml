  /api/v1/vacancies/{id}/candidates:
    get:
      security:
      - BearerAuth: []
      description: 'mode=list — постранично (limit/offset), mode=feed — лента без
        пагинации.

        Только кандидаты с активным резюме и без действия по этой вакансии.'
      tags:
      - matching
      summary: Кандидаты под вакансию
      parameters:
      - type: integer
        description: ID вакансии
        name: id
        in: path
        required: true
      - enum:
        - list
        - feed
        type: string
        description: list
        name: mode
        in: query
      - type: integer
        description: '20'
        name: limit
        in: query
      - type: integer
