        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
