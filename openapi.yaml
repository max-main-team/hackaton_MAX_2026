openapi: 3.1.0
info:
  description: 'API мини-приложения реверс-найма в MAX.

    Авторизация: POST /api/v1/auth c initData из MAX Bridge,

    далее заголовок Authorization: Bearer <token> (JWT, 7 дней).'
  title: MAX Mini App — Reverse Hiring API
  contact: {}
  version: '1.0'
servers:
- url: https:///
paths:
  /api/v1/auth:
    post:
      description: 'Принимает window.WebApp.initData, проверяет подпись (токен бота),

        срок давности, апсертит пользователя и выдаёт JWT (7 дней).'
      tags:
      - auth
      summary: Авторизация по initData
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.AuthResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/max-miniapp_backend_internal_dto.AuthRequest'
  /api/v1/auth/demo:
    post:
      description: Создаёт/возвращает тестового пользователя и JWT. В prod отключён.
      tags:
      - auth
      summary: Демо-вход (только dev)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.AuthResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/max-miniapp_backend_internal_dto.DemoAuthRequest'
  /api/v1/candidates:
    get:
      security:
      - BearerAuth: []
      description: 'Активные резюме всех кандидатов, поиск по title/skills/city,

        пагинация limit/offset. Роль рекрутера обязательна.'
      tags:
      - matching
      summary: Все кандидаты (для компаний)
      parameters:
      - type: string
        description: подстрока в title/skills/city
        name: q
        in: query
      - type: integer
        description: '20'
        name: limit
        in: query
      - type: integer
        description: '0'
        name: offset
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.AllCandidatesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
