                items:
                  $ref: '#/components/schemas/max-miniapp_backend_internal_dto.Vacancy'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
    post:
      security:
      - BearerAuth: []
      tags:
      - vacancy
      summary: Создать вакансию
      parameters:
      - type: integer
        description: ID компании
        name: id
        in: path
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.Vacancy'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/max-miniapp_backend_internal_dto.VacancyInput'
  /api/v1/companies/{id}/verify:
