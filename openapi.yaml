        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/max-miniapp_backend_internal_dto.CompanyInput'
  /api/v1/companies/{id}/vacancies:
    get:
      security:
      - BearerAuth: []
      tags:
      - vacancy
      summary: Вакансии компании
      parameters:
      - type: integer
        description: ID компании
        name: id
        in: path
        required: true
      responses:
