      security:
      - BearerAuth: []
      tags:
      - resume
      summary: Моё резюме
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.Resume'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/max-miniapp_backend_internal_dto.ErrorResponse'
    put:
      security:
      - BearerAuth: []
      description: 'При каждом сохранении пишется снапшот в resume_versions.

