name: DB SQL (one-off, temp)

on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL to execute on prod DB'
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Execute SQL
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: docker exec max-miniapp-postgres-prod psql -U postgres -d maxapp -c "${{ inputs.sql }}"
